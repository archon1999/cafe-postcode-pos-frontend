name: Deploy POS Frontend

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy production over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          port: ${{ secrets.PORT }}
          timeout: 60s
          command_timeout: 25m
          script_stop: true
          script: |
            set -Eeuo pipefail
            exec 9>/home/postcode/.cafe-postcode-deploy.lock
            flock --wait 1800 9
            cd /home/postcode/pos-frontend
            test -f .env.production
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --message "pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git fetch --prune origin production
            git checkout --detach origin/production
            docker compose --env-file .env.production config >/dev/null
            docker compose --env-file .env.production up -d --build --wait --wait-timeout 180
            docker compose --env-file .env.production ps
            docker compose --env-file .env.production exec -T frontend wget -qO- http://127.0.0.1/healthz >/dev/null
